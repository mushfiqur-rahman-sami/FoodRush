plugins {
    id 'com.android.application'
}

// Optional TURN relay for in-app calls on networks that block direct connections. Put these in
// local.properties (never commit them): turn.url=turn:..., turn.username=..., turn.password=...
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}
def quoted = { String key -> '"' + (localProps.getProperty(key, '').replace('"', '\\"')) + '"' }

// Firebase is optional at build time: without google-services.json the app runs in
// on-device mode (local accounts and orders). Add the file to turn on the cloud path.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.foodrush.app'
    compileSdk 37

    defaultConfig {
        applicationId 'com.foodrush.app'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'TURN_URL', quoted('turn.url')
        buildConfigField 'String', 'TURN_USERNAME', quoted('turn.username')
        buildConfigField 'String', 'TURN_PASSWORD', quoted('turn.password')
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'com.google.android.material:material:1.13.0'

    implementation 'com.squareup.retrofit2:retrofit:2.12.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:5.0.7'

    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    // Free, open-source WebRTC build for the in-app voice calls.
    implementation 'io.getstream:stream-webrtc-android:1.3.10'

    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-messaging'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'net.sf.kxml:kxml2:2.2.2'
}
